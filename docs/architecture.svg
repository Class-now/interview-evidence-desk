<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1f2328">Interview Evidence Desk - architecture</text>
  <g font-size="13" fill="#57606a">
    <rect x="760" y="26" width="18" height="14" rx="3" fill="#ddf4ff" stroke="#0969da"/><text x="784" y="38">LLM stage (free / open-weight)</text>
    <rect x="980" y="26" width="18" height="14" rx="3" fill="#f6f8fa" stroke="#57606a"/><text x="1004" y="38">deterministic code</text>
    <rect x="760" y="50" width="18" height="14" rx="3" fill="#fff8c5" stroke="#9a6700"/><text x="784" y="62">human checkpoint</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
  <g font-size="15">
    <!-- inputs -->
    <rect x="40" y="110" width="170" height="90" rx="10" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 4"/>
    <text x="125" y="145" text-anchor="middle" font-weight="700">Inputs</text>
    <text x="125" y="168" text-anchor="middle" font-size="13">5-10 transcripts (.txt)</text>
    <text x="125" y="186" text-anchor="middle" font-size="13">+ founder hypotheses</text>
    <!-- row 1 -->
    <rect x="260" y="110" width="190" height="90" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="355" y="145" text-anchor="middle" font-weight="700">1. extract</text>
    <text x="355" y="168" text-anchor="middle" font-size="13">quote + line + kind +</text>
    <text x="355" y="186" text-anchor="middle" font-size="13">said / did / paid</text>
    <rect x="500" y="110" width="190" height="90" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-dasharray="6 3"/>
    <text x="595" y="145" text-anchor="middle" font-weight="700">2. verify + 2b. judge</text>
    <text x="595" y="168" text-anchor="middle" font-size="13">literal match, then one</text>
    <text x="595" y="186" text-anchor="middle" font-size="13">LLM call per quote (stance)</text>
    <rect x="740" y="110" width="190" height="90" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="835" y="145" text-anchor="middle" font-weight="700">3. cluster</text>
    <text x="835" y="168" text-anchor="middle" font-size="13">weights 1 / 2 / 3,</text>
    <text x="835" y="186" text-anchor="middle" font-size="13">lean + coverage</text>
    <text x="900" y="242" text-anchor="middle" font-size="13" fill="#9a6700">+ money/time lines the model missed</text>
    <rect x="980" y="110" width="180" height="90" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="1070" y="145" text-anchor="middle" font-weight="700">4. challenge</text>
    <text x="1070" y="168" text-anchor="middle" font-size="13">devil's advocate +</text>
    <text x="1070" y="186" text-anchor="middle" font-size="13">what changes our mind</text>
    <line x1="210" y1="155" x2="258" y2="155" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <line x1="450" y1="155" x2="498" y2="155" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <line x1="690" y1="155" x2="738" y2="155" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <line x1="930" y1="155" x2="978" y2="155" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="560" y="225" text-anchor="middle" font-size="13" fill="#cf222e">invented / irrelevant quotes dropped and listed</text>
    <!-- checkpoint -->
    <path d="M1070,200 L1070,280 L800,280" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="400" y="250" width="400" height="110" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="600" y="285" text-anchor="middle" font-weight="700" font-size="17">5. HUMAN CHECKPOINT</text>
    <text x="600" y="310" text-anchor="middle" font-size="13">founder chooses accept / reject / doubt</text>
    <text x="600" y="330" text-anchor="middle" font-size="13">+ written reason for EVERY hypothesis</text>
    <text x="600" y="350" text-anchor="middle" font-size="13" fill="#9a6700">pipeline cannot continue until complete</text>
    <!-- row 3 -->
    <path d="M520,360 L520,420 L355,420 L355,438" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <path d="M680,360 L680,420 L835,420 L835,438" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="260" y="440" width="190" height="90" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="355" y="475" text-anchor="middle" font-weight="700">6. next_questions</text>
    <text x="355" y="498" text-anchor="middle" font-size="13">past behaviour only;</text>
    <text x="355" y="516" text-anchor="middle" font-size="13">"Would you..." rejected</text>
    <rect x="740" y="440" width="190" height="90" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="835" y="475" text-anchor="middle" font-weight="700">7. memo</text>
    <text x="835" y="498" text-anchor="middle" font-size="13">decision maker named,</text>
    <text x="835" y="516" text-anchor="middle" font-size="13">quotes cite interview+line</text>
    <!-- llm layer -->
    <rect x="40" y="250" width="300" height="140" rx="10" fill="#ffffff" stroke="#0969da"/>
    <text x="190" y="278" text-anchor="middle" font-weight="700">ied/llm.py Router</text>
    <text x="56" y="302" font-size="13">JSON-schema output, temperature 0, seed</text>
    <text x="56" y="322" font-size="13">validate -> retry with error -> next back-end</text>
    <text x="56" y="342" font-size="13">1 llama.cpp Qwen2.5-3B (local, default)</text>
    <text x="56" y="362" font-size="13">2 Ollama  3 Gemini free  4 Groq free</text>
    <text x="56" y="382" font-size="13">token + time ledger per call</text>
    <!-- run record -->
    <rect x="980" y="440" width="180" height="90" rx="10" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 4"/>
    <text x="1070" y="475" text-anchor="middle" font-weight="700">run.json</text>
    <text x="1070" y="498" text-anchor="middle" font-size="13">every quote, call, token,</text>
    <text x="1070" y="516" text-anchor="middle" font-size="13">retry and human decision</text>
    <line x1="930" y1="485" x2="978" y2="485" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="40" y="600" font-size="13" fill="#57606a">UI: Gradio one-screen app (app.py) or two-step CLI (ied/cli.py). Nothing is sent to anyone; output is a draft for the founding team.</text>
  </g>
</svg>
